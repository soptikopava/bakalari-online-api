services:
  api:
    image: python:3.12-slim
    volumes:
      - /volume1/docker/skola-online-api/app:/app
      - /volume1/docker/skola-online-api/data:/data
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
